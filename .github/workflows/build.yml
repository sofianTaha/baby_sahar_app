name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Android Project & Permissions
        run: |
          flutter create --org com.example --project-name baby_sahar_app .
          
          # تعديل minSdkVersion في جميع ملفات الإعدادات سواء كانت groovy أو kts
          find android/ -name "build.gradle*" -exec sed -i 's/minSdk.*=.*/minSdk = 23/g' {} +
          find android/ -name "build.gradle*" -exec sed -i 's/minSdkVersion.*/minSdkVersion 23/g' {} +

          # إضافة الصلاحيات لملف AndroidManifest بطريقة برمجية نظيفة
          python3 -c '
          import os
          path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(path):
              with open(path, "r") as f:
                  data = f.read()
              perms = "\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>\n    <uses-permission android:name=\"android.permission.VIBRATE\"/>\n"
              if "RECORD_AUDIO" not in data:
                  data = data.replace("<application", perms + "    <application")
                  with open(path, "w") as f:
                      f.write(data)
          '
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

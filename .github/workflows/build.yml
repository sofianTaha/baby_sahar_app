name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Configure Flutter Skeleton & Baby Icon
        run: |
          flutter create --org com.example --project-name baby_sahar_app .
          
          # إعداد إذن الميكروفون
          sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>/' android/app/src/main/AndroidManifest.xml
          
          # إنشاء وتصميم أيقونة طفل لطيفة بجودة عالية
          convert -size 512x512 xc:"#FFF0F3" \
            -fill "#FF8DA1" -draw "circle 256,256 256,30" \
            -fill "#FFE5EC" -draw "circle 256,260 256,90" \
            -fill "#4A4A68" -draw "circle 200,240 200,225" \
            -fill "#4A4A68" -draw "circle 312,240 312,225" \
            -fill "#FF6D8A" -draw "circle 175,275 175,260" \
            -fill "#FF6D8A" -draw "circle 337,275 337,260" \
            -fill "#FF6D8A" -draw "circle 256,315 256,290" \
            -fill "#FFFFFF" -draw "circle 256,315 256,305" \
            baby_icon.png
          
          # توزيع الأيقونة بجميع مقاسات شاشات الأندرويد
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$dir
            convert baby_icon.png -resize 192x192 android/app/src/main/res/$dir/ic_launcher.png
          done
          
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
